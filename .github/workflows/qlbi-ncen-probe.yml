name: QLBI N-CEN adviser bridge probe

on:
  push:
    branches:
      - research/qlbi-aqr-sibling-20260331
    paths:
      - research/qlbi/ncen_probe.py
      - .github/workflows/qlbi-ncen-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ncen-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install 'requests==2.32.5'
      - name: Probe official SEC N-CEN archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qlbi_ncen_probe
          python research/qlbi/ncen_probe.py \
            --outdir qlbi_ncen_probe \
            --email 132035258+jmg2027@users.noreply.github.com \
            | tee qlbi_ncen_probe/console.json
      - name: Write summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m=json.load(open('qlbi_ncen_probe/schema_probe.json'))
          print('# QLBI N-CEN schema probe')
          print()
          for quarter, q in m['quarters'].items():
              print(f"## {quarter}")
              print(f"Archive bytes: `{q['size_bytes']}`; files: `{len(q['files'])}`")
              for name, item in q['files'].items():
                  header=item.get('header', [])
                  print(f"- `{name}`: {len(header)} columns")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qlbi-ncen-schema-probe
          path: |
            qlbi_ncen_probe/
            research/qlbi/ncen_probe.py
          if-no-files-found: warn
          retention-days: 30
