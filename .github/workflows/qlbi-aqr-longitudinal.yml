name: QLBI AQR longitudinal validation

on:
  push:
    branches:
      - research/qlbi-aqr-sibling-20260331
    paths:
      - research/qlbi/aqr_longitudinal.py
      - .github/workflows/qlbi-aqr-longitudinal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  longitudinal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install 'duckdb==1.4.0' 'numpy==2.3.2' 'pandas==2.3.2' 'pyarrow==21.0.0'
      - name: Run longitudinal validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qlbi_aqr_longitudinal
          python research/qlbi/aqr_longitudinal.py \
            --outdir qlbi_aqr_longitudinal \
            | tee qlbi_aqr_longitudinal/console.json
      - name: Write summary
        shell: bash
        run: cat qlbi_aqr_longitudinal/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qlbi-aqr-longitudinal
          path: |
            qlbi_aqr_longitudinal/
            research/qlbi/aqr_longitudinal.py
          if-no-files-found: warn
          retention-days: 30
